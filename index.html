<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morpa Pro - Tonguç LGS Video Platformu</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900/90 border-b border-slate-800 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-indigo-600 to-violet-500 p-2.5 rounded-xl shadow-lg">
                    <i class="fa-solid fa-graduation-cap text-white text-xl"></i>
                </div>
                <span class="text-xl font-extrabold bg-gradient-to-r from-indigo-400 to-violet-400 bg-clip-text text-transparent">Morpa Pro</span>
            </div>
            <div class="flex items-center space-x-3 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                <i class="fa-solid fa-bolt text-amber-400"></i>
                <span class="font-bold text-sm" id="xpCount">1,450 XP</span>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Sol Bölüm: Video Oynatıcı -->
        <div class="lg:col-span-2 space-y-4">
            
            <!-- Ders Seçimi -->
            <div class="flex space-x-2 overflow-x-auto pb-1 scrollbar-none">
                <button onclick="loadTongucSubject('din')" id="btn-din" class="subject-btn px-4 py-2 rounded-xl bg-indigo-600 text-white font-semibold text-xs whitespace-nowrap">Din Kültürü</button>
                <button onclick="loadTongucSubject('mat')" id="btn-mat" class="subject-btn px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-semibold text-xs whitespace-nowrap">Matematik</button>
                <button onclick="loadTongucSubject('fen')" id="btn-fen" class="subject-btn px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-semibold text-xs whitespace-nowrap">Fen Bilimleri</button>
                <button onclick="loadTongucSubject('turkce')" id="btn-turkce" class="subject-btn px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-semibold text-xs whitespace-nowrap">Türkçe</button>
            </div>

            <!-- Video Oynatıcı Kutusu -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-xl">
                <div class="relative aspect-video bg-black">
                    <iframe id="mainPlayer" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
                <div class="p-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                    <div>
                        <span class="text-[10px] bg-rose-600/20 text-rose-400 px-2.5 py-1 rounded-md font-bold uppercase">Tonguç Akademi 8. Sınıf</span>
                        <h1 id="activeVideoTitle" class="text-base font-bold mt-2 text-white">Ders Yükleniyor...</h1>
                    </div>
                    <a id="youtubeDirectBtn" href="#" target="_blank" class="bg-rose-600 hover:bg-rose-500 text-white px-4 py-2 rounded-xl text-xs font-bold transition flex items-center space-x-2 whitespace-nowrap shadow-lg">
                        <i class="fa-brands fa-youtube text-sm"></i><span>YouTube'da Aç</span>
                    </a>
                </div>
            </div>

        </div>

        <!-- Sağ Bölüm: Ders Listesi -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-xl flex flex-col h-[520px]">
            <h3 class="font-bold text-sm text-white mb-3 flex items-center justify-between">
                <span><i class="fa-brands fa-youtube text-rose-500 mr-2"></i>Ders Videoları</span>
                <span class="text-xs text-emerald-400 bg-emerald-950/60 border border-emerald-800 px-2.5 py-0.5 rounded-full">Aktif</span>
            </h3>

            <div id="videoList" class="flex-1 overflow-y-auto space-y-3 pr-1">
                <!-- List -->
            </div>
        </div>

    </main>

    <script>
        const tongucLessons = {
            din: [
                { title: "Zekât ve Sadaka İbadeti 📖 8DIN5", id: "bkEdlR0nMWQ", thumb: "https://img.youtube.com/vi/bkEdlR0nMWQ/hqdefault.jpg" },
                { title: "Kader ve Kaza İnancı 🌌 8DIN1", id: "q_46MAn3c8M", thumb: "https://img.youtube.com/vi/q_46MAn3c8M/hqdefault.jpg" },
                { title: "Din ve Hayat 🕊️ 8DIN3", id: "W8L0P3gqP84", thumb: "https://img.youtube.com/vi/W8L0P3gqP84/hqdefault.jpg" }
            ],
            mat: [
                { title: "Çarpanlar ve Katlar / EBOB-EKOK 📐 8MAT1", id: "v1V18T1XoWE", thumb: "https://img.youtube.com/vi/v1V18T1XoWE/hqdefault.jpg" },
                { title: "Üslü İfadeler Konu Anlatımı 🔢 8MAT2", id: "98L1I9W8gXw", thumb: "https://img.youtube.com/vi/98L1I9W8gXw/hqdefault.jpg" },
                { title: "Kareköklü İfadeler ✏️ 8MAT3", id: "B5qI3J4z83A", thumb: "https://img.youtube.com/vi/B5qI3J4z83A/hqdefault.jpg" }
            ],
            fen: [
                { title: "Mevsimler ve İklim 🌍 8FEN1", id: "Z94k3N0X7cE", thumb: "https://img.youtube.com/vi/Z94k3N0X7cE/hqdefault.jpg" },
                { title: "DNA ve Genetik Kod 🧬 8FEN2", id: "L2M9J31qX1M", thumb: "https://img.youtube.com/vi/L2M9J31qX1M/hqdefault.jpg" },
                { title: "Basınç Konu Anlatımı 🎈 8FEN3", id: "95M71X3J2N8", thumb: "https://img.youtube.com/vi/95M71X3J2N8/hqdefault.jpg" }
            ],
            turkce: [
                { title: "Fiilimsiler (Eylemsiler) Konu Anlatımı 📝 8TUR1", id: "P29xK0M1z8U", thumb: "https://img.youtube.com/vi/P29xK0M1z8U/hqdefault.jpg" },
                { title: "Cümlenin Ögeleri 🔍 8TUR2", id: "88M92xK1L0Q", thumb: "https://img.youtube.com/vi/88M92xK1L0Q/hqdefault.jpg" },
                { title: "Sözcükte Anlam Konu Anlatımı 📖 8TUR3", id: "X8M92LK19zA", thumb: "https://img.youtube.com/vi/X8M92LK19zA/hqdefault.jpg" }
            ]
        };

        function loadTongucSubject(subject) {
            document.querySelectorAll('.subject-btn').forEach(b => b.className = "subject-btn px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-semibold text-xs whitespace-nowrap");
            document.getElementById(`btn-${subject}`).className = "subject-btn px-4 py-2 rounded-xl bg-indigo-600 text-white font-semibold text-xs whitespace-nowrap";

            const listContainer = document.getElementById('videoList');
            listContainer.innerHTML = '';

            const videos = tongucLessons[subject];

            if (videos && videos.length > 0) {
                playVideo(videos[0].id, videos[0].title);

                videos.forEach((video) => {
                    const card = document.createElement('div');
                    card.className = "flex space-x-3 bg-slate-900/80 hover:bg-slate-700/60 p-2.5 rounded-xl cursor-pointer transition border border-slate-700/60 items-center";
                    card.onclick = () => playVideo(video.id, video.title);
                    card.innerHTML = `
                        <img src="${video.thumb}" class="w-24 h-14 object-cover rounded-lg shadow">
                        <div class="flex-1">
                            <h4 class="text-xs font-bold text-slate-200 leading-snug">${video.title}</h4>
                            <span class="text-[10px] text-indigo-400 font-medium">Tonguç Akademi</span>
                        </div>
                    `;
                    listContainer.appendChild(card);
                });
            }
        }

        function playVideo(id, title) {
            // Otomatik oynatma (autoplay) mobilde engellendiği için kaldırıldı, direkt oynatıcı yüklenir
            document.getElementById('mainPlayer').src = `https://www.youtube.com/embed/${id}`;
            document.getElementById('activeVideoTitle').innerText = title;
            document.getElementById('youtubeDirectBtn').href = `https://www.youtube.com/watch?v=${id}`;
        }

        loadTongucSubject('din');
    </script>
</body>
</html>
