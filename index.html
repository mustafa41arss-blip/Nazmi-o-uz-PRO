<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Morpa Pro - Tonguç LGS Otomatik Video Platformu</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-slate-900/90 border-b border-slate-800 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-gradient-to-tr from-indigo-600 to-violet-500 p-2.5 rounded-xl shadow-lg">
                    <i class="fa-solid fa-graduation-cap text-white text-xl"></i>
                </div>
                <span class="text-xl font-extrabold bg-gradient-to-r from-indigo-400 to-violet-400 bg-clip-text text-transparent">Morpa Pro</span>
            </div>
            <div class="flex items-center space-x-3 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                <i class="fa-solid fa-bolt text-amber-400"></i>
                <span class="font-bold text-sm" id="xpCount">1,450 XP</span>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <!-- Sol Bölüm: Video Oynatıcı (2 Kolon) -->
        <div class="lg:col-span-2 space-y-4">
            
            <!-- Ders Seçimi -->
            <div class="flex space-x-2 overflow-x-auto pb-1 scrollbar-none">
                <button onclick="fetchTongucVideos('din')" id="btn-din" class="subject-btn px-4 py-2 rounded-xl bg-indigo-600 text-white font-semibold text-xs whitespace-nowrap">Din Kültürü</button>
                <button onclick="fetchTongucVideos('mat')" id="btn-mat" class="subject-btn px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-semibold text-xs whitespace-nowrap">Matematik</button>
                <button onclick="fetchTongucVideos('fen')" id="btn-fen" class="subject-btn px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-semibold text-xs whitespace-nowrap">Fen Bilimleri</button>
                <button onclick="fetchTongucVideos('turkce')" id="btn-turkce" class="subject-btn px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-semibold text-xs whitespace-nowrap">Türkçe</button>
            </div>

            <!-- Video İframe -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl overflow-hidden shadow-xl">
                <div class="relative aspect-video bg-black">
                    <iframe id="mainPlayer" class="w-full h-full" src="" frameborder="0" allowfullscreen></iframe>
                </div>
                <div class="p-5">
                    <span class="text-[10px] bg-rose-600/20 text-rose-400 px-2.5 py-1 rounded-md font-bold uppercase">Tonguç 8. Sınıf LGS</span>
                    <h1 id="activeVideoTitle" class="text-lg font-bold mt-2 text-white">Video yükleniyor...</h1>
                </div>
            </div>

        </div>

        <!-- Sağ Bölüm: Otomatik Çekilen Tüm Tonguç Videoları -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-4 shadow-xl flex flex-col h-[580px]">
            <h3 class="font-bold text-sm text-white mb-3 flex items-center justify-between">
                <span><i class="fa-brands fa-youtube text-rose-500 mr-2"></i>Tonguç Ders Videoları</span>
                <span id="videoCount" class="text-xs text-indigo-400 bg-indigo-950 px-2 py-0.5 rounded-full">Yükleniyor...</span>
            </h3>

            <!-- Video Listesi -->
            <div id="videoList" class="flex-1 overflow-y-auto space-y-3 pr-1">
                <p class="text-xs text-slate-400 text-center py-8">Videolar getiriliyor...</p>
            </div>
        </div>

    </main>

    <script>
        const API_KEY = "AIzaSyDP8bM2QPpjWpxOvQtrZhifPh-_y8RVmWU"; 
        const TONGUC_CHANNEL_ID = "UC8_O_oW_b5Z8J622P6O0gGQ"; // Tonguç 8. Sınıf Kanal ID

        const subjectKeywords = {
            din: "8. Sınıf Din Kültürü",
            mat: "8. Sınıf Matematik LGS",
            fen: "8. Sınıf Fen Bilimleri",
            turkce: "8. Sınıf Türkçe LGS"
        };

        async function fetchTongucVideos(subject = 'din') {
            document.querySelectorAll('.subject-btn').forEach(b => b.className = "subject-btn px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-semibold text-xs whitespace-nowrap");
            document.getElementById(`btn-${subject}`).className = "subject-btn px-4 py-2 rounded-xl bg-indigo-600 text-white font-semibold text-xs whitespace-nowrap";

            const query = subjectKeywords[subject];
            const listContainer = document.getElementById('videoList');
            listContainer.innerHTML = '<p class="text-xs text-slate-400 text-center py-8">Tonguç videoları çekiliyor...</p>';

            try {
                const url = `https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&channelId=${TONGUC_CHANNEL_ID}&part=snippet,id&order=date&maxResults=20&q=${encodeURIComponent(query)}`;
                const response = await fetch(url);
                const data = await response.json();

                listContainer.innerHTML = '';
                
                if (!data.items || data.items.length === 0) {
                    listContainer.innerHTML = '<p class="text-xs text-amber-400 text-center py-4">Video bulunamadı.</p>';
                    return;
                }

                document.getElementById('videoCount').innerText = `${data.items.length} Video`;

                let firstVideoLoaded = false;

                data.items.forEach((item) => {
                    if (item.id.kind === "youtube#video") {
                        const videoId = item.id.videoId;
                        const title = item.snippet.title;
                        const thumb = item.snippet.thumbnails.medium.url;

                        if (!firstVideoLoaded) {
                            playVideo(videoId, title);
                            firstVideoLoaded = true;
                        }

                        const card = document.createElement('div');
                        card.className = "flex space-x-3 bg-slate-900/70 p-2 rounded-xl cursor-pointer hover:bg-slate-700/60 transition border border-slate-700/50";
                        card.onclick = () => playVideo(videoId, title);
                        card.innerHTML = `
                            <img src="${thumb}" class="w-24 h-16 object-cover rounded-lg">
                            <div class="flex-1">
                                <h4 class="text-xs font-bold text-slate-200 line-clamp-2">${title}</h4>
                            </div>
                        `;
                        listContainer.appendChild(card);
                    }
                });
            } catch (err) {
                listContainer.innerHTML = '<p class="text-xs text-rose-400 text-center py-4">Videolar yüklenirken hata oluştu.</p>';
            }
        }

        function playVideo(id, title) {
            document.getElementById('mainPlayer').src = `https://www.youtube.com/embed/${id}?autoplay=1`;
            document.getElementById('activeVideoTitle').innerText = title;
        }

        // Sayfa açıldığında Din Kültürü videoları getirilsin
        fetchTongucVideos('din');
    </script>
</body>
</html>
